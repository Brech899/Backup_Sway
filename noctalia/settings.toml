config_version = 16

[bar.default]
background_opacity = 0.39999999105930328
concave_edge_corners = false
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
shadow = false
start = [ "wallpaper", "workspaces" ]

[control_center.calendar]
show_events_card = false

[location]
address = "Coltauco Chile"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.39999999105930328

[osd]
background_opacity = 0.39999999105930328
position = "bottom_center"

[shell]
avatar_path = "/home/pc/Imágenes/Gangster cat.jpeg"

    [shell.launcher]
    category_icons_only = true
    layout = "simple"

    [shell.panel]
    borders = false
    transparency_mode = "glass"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "foot", "sway" ]

[wallpaper]
directory = "/home/pc/Imágenes/Fondos"
transition = [ "fade" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/pc/Imágenes/Fondos/1392877.jpg"

    [wallpaper.last]
    path = "/home/pc/Imágenes/Fondos/1392877.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/pc/Imágenes/Fondos/1392877.jpg"

[widget.media]
hide_when_no_media = true
max_length = 126
title_scroll = "always"

[widget.network]
show_label = false